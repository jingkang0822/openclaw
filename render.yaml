services:
  - type: web
    name: clawx
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: CLAWX_STATE_DIR
        value: /data/.clawx
      - key: CLAWX_WORKSPACE_DIR
        value: /data/workspace
      - key: CLAWX_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: clawx-data
      mountPath: /data
      sizeGB: 1
