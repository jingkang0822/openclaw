services:
  clawx-gateway:
    image: ${CLAWX_IMAGE:-clawx:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWX_GATEWAY_TOKEN: ${CLAWX_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${CLAWX_CONFIG_DIR}:/home/node/.clawx
      - ${CLAWX_WORKSPACE_DIR}:/home/node/.clawx/workspace
    ports:
      - "${CLAWX_GATEWAY_PORT:-19789}:19789"
      - "${CLAWX_BRIDGE_PORT:-19790}:19790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${CLAWX_GATEWAY_BIND:-lan}",
        "--port",
        "19789",
      ]

  clawx-cli:
    image: ${CLAWX_IMAGE:-clawx:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWX_GATEWAY_TOKEN: ${CLAWX_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${CLAWX_CONFIG_DIR}:/home/node/.clawx
      - ${CLAWX_WORKSPACE_DIR}:/home/node/.clawx/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
